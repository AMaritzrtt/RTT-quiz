<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTT Quiz Show</title>

<style>
body {
  font-family: Georgia, 'Times New Roman', serif;
  background: linear-gradient(to bottom, #c9d1cb, #3b3d3c);
  margin: 0;
  padding: 0;
  color: #2c3e50;
  text-align: center;
}

h1 {
  background: #2f4f4f;
  color: white;
  padding: 2rem 0;
  margin: 0;
  border-bottom: 5px solid #a3b9a5;
  font-size: 2rem;
  text-transform: uppercase;
  letter-spacing: 2px;
}

#box {
  max-width: 850px;
  margin: 2rem auto;
  padding: 2rem;
  background: #ffffff;
  border-radius: 15px;
  box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
}

input {
  width: 90%;
  padding: 12px;
  font-size: 16px;
  border: 2px solid #a3b9a5;
  border-radius: 8px;
  margin: 8px 0;
  text-align: center;
  font-family: Georgia, serif;
}

button {
  width: 85%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 16px;
  font-family: Georgia, serif;
  transition: 0.3s ease;
}

.primary {
  background: #2f4f4f;
  color: white;
  font-weight: bold;
  border: 2px solid #a3b9a5;
}

.primary:hover {
  background: #a3b9a5;
  color: #2c3e50;
}

.option {
  background: #f0f5f0;
  color: #2c3e50;
  border-left: 6px solid #a3b9a5;
  font-weight: bold;
}

.option:hover {
  background: #a3b9a5;
  color: white;
}

h3 {
  font-family: Arial, Helvetica, sans-serif;
  color: #2c3e50;
  border-left: 6px solid #a3b9a5;
  padding-left: 10px;
  text-align: left;
  max-width: 700px;
  margin: 20px auto;
}

/* ADMIN PANEL */
#adminPanel {
  display: none;
  position: fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: #2f4f4f;
  color: white;
  padding: 20px;
  overflow-y: auto;
  z-index: 999;
}

/* 🏆 UPDATED TITLE */
#adminPanel h1 {
  color: #f1c40f;
}

#adminPanel h2 {
  color: white;
}

#adminPanel p {
  background: #f0f5f0;
  color: #2c3e50;
  padding: 10px;
  margin: 8px 0;
  border-radius: 10px;
}

/* ADMIN BUTTONS */
.admin-btn {
  display: block;
  width: 160px;
  padding: 8px;
  font-size: 13px;
  margin: 8px auto;
  border-radius: 6px;
  cursor: pointer;
  border: none;
}

.reset-btn {
  background: #b91c1c;
  color: white;
}

.reset-btn:hover {
  background: #ef4444;
}

.close-btn {
  background: #111827;
  color: white;
}

.close-btn:hover {
  background: #374151;
}

@media (max-width: 600px) {
  h1 { font-size: 18px; }
  button { font-size: 14px; width: 92%; }
  h3 { font-size: 16px; }
}
</style>
</head>

<body>

<h1>🎓 RTT QUIZ SHOW</h1>

<div id="box">

    <div id="startScreen">
        <p>Tik jou inligting om te begin:</p>

        <input id="name" placeholder="Jou naam...">
        <input id="school" placeholder="Skool naam...">

        <button class="primary" onclick="startGame()">Begin Quiz</button>
    </div>

    <h3 id="question"></h3>
    <div id="answers"></div>

</div>

<div id="adminPanel"></div>

<script>

/* ---------------- QUESTIONS ---------------- */
const questions = [
    { q:"1.1 Invoertoestel?", a:["Printer","Monitor","Keyboard","Speaker"], correct:2 },
    { q:"1.2 OS funksie?", a:["Speletjies","Bestuur rekenaar","Fotos","Email"], correct:1 },
    { q:"1.3 Spesialis sagteware?", a:["Windows","Excel","Linux","Mac"], correct:1 },
    { q:"2.1 Beeldlêer?", a:[".docx",".jpg",".mp3",".exe"], correct:1 },
    { q:"2.2 Argiveer?", a:["Delete","Stoor","Druk","Email"], correct:1 }
];

let current = 0;
let score = 0;
let player = "";
let school = "";
let isAdmin = false;

let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];

function isAdminUser(name) {
    return name.trim().toLowerCase() === "admin2026";
}

function startGame() {
    player = document.getElementById("name").value.trim();

    if (isAdminUser(player)) {
        isAdmin = true;
        openAdminPanel();
        return;
    }

    school = document.getElementById("school").value.trim();
    if (!player || !school) return alert("Vul naam EN skool in!");

    document.getElementById("startScreen").style.display = "none";
    showQ();
}

function showQ() {
    if (current >= questions.length) return endGame();

    let q = questions[current];
    document.getElementById("question").innerText = q.q;

    let div = document.getElementById("answers");
    div.innerHTML = "";

    q.a.forEach((ans,i)=>{
        let b = document.createElement("button");
        b.className = "option";
        b.innerText = ans;

        b.onclick = ()=>{
            if(i === q.correct) score++;
            current++;
            showQ();
        };

        div.appendChild(b);
    });
}

function endGame() {

    if (!isAdmin) {
        leaderboard.push({name: player, school, score});
        localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
    }

    document.getElementById("question").innerHTML =
        `🎉 Klaar ${player} (${school})! Jy het ${score}/${questions.length}`;

    document.getElementById("answers").innerHTML =
        `<button class="primary" onclick="location.reload()">Speel weer</button>`;

    if (isAdmin) openAdminPanel();
}

/* ---------------- ADMIN PANEL ---------------- */
function openAdminPanel() {
    let panel = document.getElementById("adminPanel");
    let data = JSON.parse(localStorage.getItem("leaderboard")) || [];

    let top3 = data.slice(0,3);
    let rest = data.slice(3);

    panel.innerHTML = `
        <h1>🏆 Leierbord</h1>
        <h2>RTT Quiz Resultate</h2>

        <div style="display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-bottom:20px;">
            ${top3.map((p,i)=>`
                <div style="background:#f0f5f0;color:#2c3e50;padding:15px;border-radius:12px;width:140px;">
                    <h3>${i===0?"🥇":i===1?"🥈":"🥉"}</h3>
                    <p><b>${p.name}</b></p>
                    <p>${p.school}</p>
                    <p>${p.score}/${questions.length}</p>
                </div>
            `).join("")}
        </div>

        ${rest.map((p,i)=>
            `<p>#${i+4} ${p.name} (${p.school}) - ${p.score}/${questions.length}</p>`
        ).join("")}

        <button class="admin-btn reset-btn" onclick="resetLeaderboard()">🗑 Reset</button>
        <button class="admin-btn close-btn" onclick="closeAdmin()">🚪 Sluit Panel</button>
    `;

    panel.style.display = "block";
}

function resetLeaderboard() {
    let pass = prompt("Confirm password:");
    if (pass === "RTT2026") {
        localStorage.removeItem("leaderboard");
        openAdminPanel();
    } else {
        alert("Wrong password ❌");
    }
}

function closeAdmin() {
    document.getElementById("adminPanel").style.display = "none";
}

</script>

</body>
</html>
