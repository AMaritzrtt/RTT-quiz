<!DOCTYPE html>
<html lang="af">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTT Quiz Show</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    text-align: center;
}

/* MOBILE FRIENDLY CARD */
#box {
    background: rgba(255,255,255,0.08);
    width: 95%;
    max-width: 650px;
    margin: 15px auto;
    padding: 20px;
    border-radius: 18px;
}

/* INPUT */
input {
    padding: 14px;
    width: 90%;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    text-align: center;
    margin: 10px 0;
}

/* BUTTONS (BIG FOR PHONE) */
button {
    padding: 14px;
    width: 95%;
    margin: 10px 0;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    font-size: 18px;
}

.primary {
    background: #00ffcc;
    font-weight: bold;
    color: black;
}

.option {
    background: white;
    color: black;
}

.option:hover {
    background: #00ffcc;
}

/* FULLSCREEN BOARD */
#fullscreenBoard {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: #00ffcc;
    padding: 20px;
    font-size: 24px;
    overflow-y: auto;
}

/* MOBILE TEXT SIZE */
h1 { font-size: 24px; }
h3 { font-size: 18px; }
</style>
</head>

<body>

<h1>🎓 RTT QUIZ SHOW</h1>

<div id="box">

    <!-- START -->
    <div id="startScreen">
        <p>Tik jou naam om te begin:</p>
        <input id="name" placeholder="Jou naam...">

        <button class="primary" onclick="startGame()">Begin Quiz</button>
        <button class="primary" onclick="toggleBoard()">🏆 Wys Leaderboard</button>
    </div>

    <!-- QUIZ -->
    <h3 id="question"></h3>
    <div id="answers"></div>

</div>

<!-- FULLSCREEN LEADERBOARD -->
<div id="fullscreenBoard"></div>

<script>

/* ---------------- QUESTIONS ---------------- */
const questions = [
    { q:"1.1 Invoertoestel?", a:["Printer","Monitor","Keyboard","Speaker"], correct:2 },
    { q:"1.2 Doel van OS?", a:["Speletjies maak","Bestuur rekenaar","Internet","Fotos"], correct:1 },
    { q:"1.3 Spesialis sagteware?", a:["Windows","Excel","Linux","Mac"], correct:1 },
    { q:"1.4 RFID beteken?", a:[
        "Radio Frequency Information Device",
        "Radio Frequency Identification",
        "Random Input Device",
        "Real File ID"
    ], correct:1 },
    { q:"2.1 Beeldlêer?", a:[".docx",".jpg",".mp3",".exe"], correct:1 },
    { q:"2.2 Argiveer beteken?", a:[
        "Delete",
        "Stoor vir later",
        "Druk uit",
        "Email"
    ], correct:1 }
];

let current = 0;
let score = 0;
let player = "";

let leaderboard = JSON.parse(localStorage.getItem("leaderboard")) || [];

/* ---------------- START ---------------- */
function startGame() {
    player = document.getElementById("name").value.trim();
    if (!player) return alert("Tik jou naam!");

    document.getElementById("startScreen").style.display = "none";
    showQ();
}

/* ---------------- QUIZ ---------------- */
function showQ() {
    if (current >= questions.length) return endGame();

    let q = questions[current];
    document.getElementById("question").innerText = q.q;

    let div = document.getElementById("answers");
    div.innerHTML = "";

    q.a.forEach((ans,i)=>{
        let b = document.createElement("button");
        b.className = "option";
        b.innerText = ans;

        b.onclick = ()=>{
            if(i === q.correct) score++;
            current++;
            showQ();
        };

        div.appendChild(b);
    });
}

/* ---------------- END ---------------- */
function endGame() {
    saveScore(player, score);

    document.getElementById("question").innerHTML =
        `🎉 Klaar ${player}! Jy het ${score}/${questions.length}`;

    document.getElementById("answers").innerHTML =
        `<button class="primary" onclick="location.reload()">Speel weer</button>`;
}

/* ---------------- SAVE ---------------- */
function saveScore(name, score) {
    leaderboard.push({name, score});
    leaderboard.sort((a,b)=>b.score-a.score);
    leaderboard = leaderboard.slice(0,10);

    localStorage.setItem("leaderboard", JSON.stringify(leaderboard));
}

/* ---------------- FULLSCREEN LEADERBOARD ---------------- */
function toggleBoard() {
    let board = document.getElementById("fullscreenBoard");

    if (board.style.display === "block") {
        board.style.display = "none";
        return;
    }

    let data = JSON.parse(localStorage.getItem("leaderboard")) || [];

    board.innerHTML = `
        <h1>🏆 LEADERBOARD</h1>

        ${data.map((p,i)=>
            `<p>#${i+1} ${p.name} - ${p.score}/${questions.length}</p>`
        ).join("")}

        <br>

        <button onclick="resetLeaderboard()" class="primary">
        🗑 Reset Leaderboard
        </button>

        <button onclick="toggleBoard()" class="primary">
        Sluit
        </button>
    `;

    board.style.display = "block";
}

/* ---------------- PASSWORD RESET ---------------- */
function resetLeaderboard() {
    let pass = prompt("Tik admin wagwoord:");

    if(pass === "RTT2026") {
        localStorage.removeItem("leaderboard");
        alert("Leaderboard is skoongemaak ✔");
        toggleBoard();
        toggleBoard();
    } else {
        alert("Wrong password ❌");
    }
}

</script>

</body>
</html>
